<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control · 电脑鼠整合上位机（重设计原型 · 扁平）</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23121316'/%3E%3Cpath d='M8 24V11h4v13zm6 0V7h4v17zm6 0v-8h4v8z' fill='%232B4FF2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/assets/style.css">
</head>
<body>

<!-- ═══ 左轨：品牌 + 导航 + 情景模拟 ═══════════════════════════════════════ -->
<aside class="rail" id="rail">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M5 17v-6M12 17V7M19 17v-4"/>
      </svg>
    </span>
    <span class="brand-text"><b>CONTROL</b><i>电脑鼠整合上位机</i></span>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="rail-foot">
    <label class="scene-pick">
      <span>情景</span>
      <select id="scene" title="只在原型里有效：切换可演示的状态组合">
        <option value="ready">就绪 · 待发车</option>
        <option value="run">运行中 · 冲刺</option>
        <option value="estop">急停 · 锁存</option>
        <option value="down">断连 · 两路都空</option>
        <option value="oldfw">旧固件 310 · 4 灯未知</option>
        <option value="novideo">无视频 · 只跑小车</option>
      </select>
    </label>
    <!-- ⚠️ 这两格**由 JS 填**（`shell.js` 的 `renderRailMeta`），不写死：
         写死过一次 "v9 / PROTO 9"，协议升到 v10 之后它还在那儿，而它长得跟
         真数据一模一样 —— 是"第二个真相"。填不进去就显示 `—`，不编。 -->
    <div class="rail-meta"><span id="rail-mode">—</span><span id="rail-proto">—</span></div>
  </div>
</aside>

<!-- ═══ 主区 ═══════════════════════════════════════════════════════════════ -->
<div class="app">
  <header class="topbar">
    <div class="crumb" id="crumb"></div>
    <div class="devices" id="devices"></div>
    <div class="top-actions">
      <span class="ws" id="ws"><i></i>实时</span>
      <button class="btn" id="btn-record">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="7"/></svg>
        <span>开始记录</span>
      </button>
      <button class="btn btn-estop" id="btn-estop" title="急停（任何时候都可按）">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="6" width="12" height="12" rx="3" fill="currentColor" stroke="none"/></svg>
        <span>急停</span>
      </button>
    </div>
  </header>

  <main class="main" id="main"></main>

  <!-- 底部日志坞：收起只占一行，收起时也有"最近一条"可扫 -->
  <footer class="dock" id="dock">
    <button class="dock-head" id="dock-toggle">
      <span class="dock-caret">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
      </span>
      <span class="dock-title">活动</span>
      <span class="dock-last" id="dock-last"></span>
      <span class="dock-count" id="dock-count"></span>
    </button>
    <div class="dock-body" id="dock-body">
      <div class="dock-tools">
        <div class="seg" id="log-src"></div>
        <div class="seg" id="log-lvl"></div>
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="6"/><path d="M16 16l4 4"/></svg>
          <input id="log-q" placeholder="过滤关键字">
        </label>
        <button class="btn btn-sm btn-ghost" id="log-clear">清空</button>
      </div>
      <div class="log" id="log"></div>
    </div>
  </footer>
</div>

<!-- ═══ 设备抽屉：点顶栏设备片打开 ═══════════════════════════════════════ -->
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true">
  <header class="drawer-head">
    <div>
      <div class="eyebrow" id="dr-eyebrow">设备</div>
      <h2 id="dr-title">电脑鼠</h2>
    </div>
    <button class="icon-btn" id="dr-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </header>
  <div class="drawer-body" id="dr-body"></div>
</aside>

<div class="toasts" id="toasts"></div>

<script src="/static/assets/lib.js"></script>
<script src="/static/assets/draw.js"></script>
<script src="/static/assets/views/overview.js"></script>
<script src="/static/assets/views/live.js"></script>
<script src="/static/assets/views/params.js"></script>
<script src="/static/assets/views/race.js"></script>
<script src="/static/assets/views/maint.js"></script>
<script src="/static/assets/views/video.js"></script>
<script src="/static/assets/views/track.js"></script>
<script src="/static/assets/views/data.js"></script>
<script src="/static/assets/views/replay.js"></script>
<script src="/static/assets/shell.js"></script>
</body>
</html>
