# 电脑鼠整合上位机（Control）—— 唯一配置
#
# 纪律：本文件是**唯一真相来源**；界面里改的东西（场地标定）也会写回这里。
# 相对路径一律相对于本文件所在目录（Control/）。

server:
  host: 127.0.0.1        # 单机自用；要开 0.0.0.0 必须先把鉴权补上
  port: 8770             # 与历史 PhoneCamera 的 8765 错开（那个服务已随改版二十四下线）
  session_root: sessions
  log_ring: 800          # 服务日志环形缓冲行数

records:
  # 实验 8「从发车到停止」的记录目录（`*.maze.json`，自包含、可拷走、可导入复盘）。
  # 为什么**不放进 sessions/**：它是**鼠单路**的产物，且要在"没开会话"时也能记
  # （只跑一盘迷宫不必开全套会话）。若会话开着，会在 timeline 里记一行指向它。
  maze_root: records/maze

mouse:
  target: ""             # ""=由界面选 | "COM7" | "tcp://127.0.0.1:5555" | "replay://sessions/xxx/mouse"
  baud: 115200
  auto_stream: true      # 连上即 STREAM ON（固件上电默认静默）
  # 连上后开哪种拉取（上游 2.9.0 起有二选一）：
  #   stopwait = 停等（一条一答，帧率 = 1/RTT，真机 4.4~6.5 Hz）—— **默认**
  #   pace     = 批式（RATE PULL 3 100ms ⇒ 目标 10 Hz，停等式 ~4 Hz 的 2.5 倍）
  # ⚠️ 默认**停等**（2026-10-15 定，改版二十一从批式回退）：稳定优先 —— 全链路
  #   在途恒 1 条请求、帧率就是 1/RTT，出任何异常都能当场归因（2.1.0 那次的教训）。
  #   批式 10 Hz 档虽然压测过（300 s 级存活、交付率 99.9%），但突发量是停等的
  #   2.5 倍 ⇒ 留给"要看密波形"的调试场合，由人在界面上显式切过去。
  #   顶格 13.3 Hz 只活 176 s ⇒ **别顺着这个键往上调**。
  #   上游没有 pace 门面（老版本）时这一项**自动失效**，仍是停等。
  stream_mode: stopwait
  scheduler_hz: 50
  telemetry_window_s: 30.0
  wave_window_ms: 10000
  auto_reconnect: true

# ⚠️ 改版二十四删掉的两段（**不要再加回来**）：
#   camera:  —— PhoneCamera 的 base/token/launcher/探测周期。手机相机整块下线，
#               位置数据改由 video 段（视频文件 → Auto Locate 会话解析）给。
#   locator: —— 在线定位的 profile/队列/赛后批量。在线那一路随相机一起没了；
#               离线解析的参数现在归上游自己的 `Auto Locate/config.yaml`（见 video.config）。
# 为什么不"留着但不用"：本层配置是"未知键直接报错"的，留着没人读的段会让现场
# 改了它却毫无反应 —— 那种哑巴配置比报错难查得多。

arena:
  # 8×8 场地的几何 —— 现在只有一个用途：**画轨迹的背景网格**（`/health.arena`）。
  # 原来这里还有相机外参（`fw_to_arena` / `nadir_xy` / `camera_height_mm` /
  # `calibrated`）：卷尺量镜头高度、把固件格子映到图像坐标。改版二十四相机下线，
  # 视觉坐标改由**上游 Auto Locate 自己的标定**给（`video.config` 那份），
  # 本层不再持有一份"没人写也没人读"的标定值 —— 那种值只会让人以为改了有用。
  grid: 8                # 固件迷宫 8×8
  pitch_mm: 180.0
  field_mm: 1440.0

clock:
  offset_ms: 0.0         # t_pc_ms = device_ms - offset_ms
  uncertainty_ms: 250.0  # 未标定前用一个诚实的"很大"
  source: assumed        # assumed | manual | sync_pulse | l2_minlatency

paths:
  remotecontrol_host: "../RemoteControl/host"
  autolocate: "../Auto Locate"
  # ⚠️ 原来的 phonecamera_pc 随相机下线删掉（代启、离线导入都不在了）

video:
  # 视频复盘（改版二十四）。位置数据**唯一来路**：视频文件 → Auto Locate 会话解析
  # （`run_session` → `session.json` + `trajectory.csv`），不再有实时相机链路。
  #
  # root: 界面列这里面的视频（mp4/mov/mkv/avi）；现场也可以直接手填绝对路径
  #       （大文件不网页上传，从别处拷进来更省事也更可靠）。
  root: "../video"
  # out_root: 会话产物根。与 records/maze 并列，**不塞 sessions/**：
  #   两者是不同来路的产物（鼠单路 vs 视觉单路），混在一处会让"这次记录有什么"
  #   变成一句说不清的话。
  out_root: "records/video"
  # config: 交给上游的**项目配置**。必须给 —— `python -m aruco_locator.session`
  #   不收 `--config`，直接跑会拿内置默认值：720p 必需的 detection.scales、
  #   内参、视差全部不生效，结果是一堆无效帧，然后被误判成"这个视频不行"。
  config: "../Auto Locate/config.yaml"
  stride: 1              # 抽帧步长；1=逐帧。调大能快，但轨迹点变稀
  maze: true             # 是否做多帧迷宫融合（S4）；关掉只出轨迹
  timeout_s: 1800        # 单次会话硬超时（30 min）；到点 kill 并标 failed

